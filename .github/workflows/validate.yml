name: Validate Omada add-on
on:
  push:
    branches: [main]
    paths:
      - 'omada_v3/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'omada_v3/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Run integration and update tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and smoke-test image
        run: |
          docker build --pull --tag omada-v3-ci ./omada_v3
          docker run --rm --entrypoint /bin/sh omada-v3-ci -c 'nginx -V && python3 --version && test -x /opt/tplink/EAPController/jre/bin/java'
