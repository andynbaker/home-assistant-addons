worker_processes 1;
pid /run/omada-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/omada-nginx-client;
    proxy_temp_path /tmp/omada-nginx-proxy;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_ingress_path $ingress_path {
        default "";
        ~^(?<validated_ingress_path>/api/hassio_ingress/[A-Za-z0-9_-]+)/?$ $validated_ingress_path;
    }
    server {
        listen @@INGRESS_PORT@@;
        server_name _;
        absolute_redirect off;
        allow 172.30.32.2;
        deny all;
        client_max_body_size 512m;
        if ($ingress_path = "") { return 403; }

        location / {
            proxy_pass https://127.0.0.1:8043;
            # Omada v3 expects the HTTPS management port in its Host header.
            proxy_set_header Host 127.0.0.1:8043;
            proxy_set_header Origin https://127.0.0.1:8043;
            proxy_set_header Referer https://127.0.0.1:8043/;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Ingress-Path $ingress_path;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # TLS is only to this container's local, self-signed controller.
            proxy_ssl_verify off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_redirect ~^https?://[^/]+(/.*)$ $ingress_path$1;
            proxy_redirect ~^(/.*)$ $ingress_path$1;
            proxy_cookie_path / $ingress_path/;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options SAMEORIGIN always;

            sub_filter_once off;
            sub_filter_types application/javascript text/javascript application/json text/css;
            # Relative assets already work. Rewrite only Omada's root routes,
            # leaving JavaScript regular expressions and external links intact.
            sub_filter '"/api/' '"$ingress_path/api/';
            sub_filter "'/api/" "'$ingress_path/api/";
            sub_filter '"/web/' '"$ingress_path/web/';
            sub_filter "'/web/" "'$ingress_path/web/";
            sub_filter '"/hotspot/' '"$ingress_path/hotspot/';
            sub_filter "'/hotspot/" "'$ingress_path/hotspot/";
            sub_filter '"/portal/' '"$ingress_path/portal/';
            sub_filter "'/portal/" "'$ingress_path/portal/";
            sub_filter '"/omada/' '"$ingress_path/omada/';
            sub_filter "'/omada/" "'$ingress_path/omada/";
            sub_filter '"/login' '"$ingress_path/login';
            sub_filter "'/login" "'$ingress_path/login";
            sub_filter '"/startLaunch' '"$ingress_path/startLaunch';
            sub_filter "'/startLaunch" "'$ingress_path/startLaunch";
        }
    }
}
