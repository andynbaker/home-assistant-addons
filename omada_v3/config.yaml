name: Omada Controller v3 (mbentley)
version: "3.2.17-2"
slug: omada_v3
description: Legacy TP-Link Omada 3.2 controller using the mbentley image
url: https://github.com/andynbaker/home-assistant-omada-v3
arch:
  - amd64
  - aarch64
stage: experimental
startup: services
boot: manual
init: true
legacy: true
host_network: true
timeout: 120
backup: cold
webui: "https://[HOST]:[PORT:8043]"
map:
  - type: addon_config
    path: /opt/tplink/EAPController/data
    read_only: false
ulimits:
  nofile:
    soft: 4096
    hard: 8192
environment:
  MANAGE_HTTP_PORT: "8088"
  MANAGE_HTTPS_PORT: "8043"
  PORTAL_HTTP_PORT: "8088"
  PORTAL_HTTPS_PORT: "8843"
options:
  TZ: America/Chicago
  PUID: "1000"
  PGID: "1000"
  SHOW_SERVER_LOGS: "true"
  SHOW_MONGODB_LOGS: "false"
  SMALL_FILES: "false"
schema:
  TZ: str
  PUID: match(^[0-9]+$)
  PGID: match(^[0-9]+$)
  SHOW_SERVER_LOGS: list(true|false)
  SHOW_MONGODB_LOGS: list(true|false)
  SMALL_FILES: list(true|false)
