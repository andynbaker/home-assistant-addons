name: Omada Controller v3 (mbentley)
version: "3.2.17-9"
slug: omada_v3
description: Legacy TP-Link Omada 3.2 controller using the mbentley image
url: https://github.com/andynbaker/home-assistant-addons
arch:
  - amd64
  - aarch64
stage: experimental
startup: services
boot: manual
init: true
legacy: true
host_network: true
timeout: 120
backup: cold
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:access-point-network
panel_title: Omada
panel_admin: true
map:
  - type: addon_config
    path: /opt/tplink/EAPController/data
    read_only: false
ulimits:
  nofile:
    soft: 4096
    hard: 8192
options:
  MANAGE_HTTP_PORT: 18088
  MANAGE_HTTPS_PORT: 8043
  PORT_APP_DISCOVERY: 27001
  PORT_CONTROLLER_SEARCH: 27002
  PORT_DISCOVERY: 29810
  PORT_MANAGER_V1: 29811
  PORT_ADOPT_V1: 29812
  PORT_UPGRADE_V1: 29813
  MONGODB_PORT: 27217
  RMI_PORT: 1099
  TZ: America/Chicago
  PUID: "1000"
  PGID: "1000"
  SHOW_SERVER_LOGS: "true"
  SHOW_MONGODB_LOGS: "false"
  SMALL_FILES: "false"
schema:
  MANAGE_HTTP_PORT: int(1024,65535)
  MANAGE_HTTPS_PORT: int(1024,65535)
  PORT_APP_DISCOVERY: int(1024,65535)
  PORT_CONTROLLER_SEARCH: int(1024,65535)
  PORT_DISCOVERY: int(1024,65535)
  PORT_MANAGER_V1: int(1024,65535)
  PORT_ADOPT_V1: int(1024,65535)
  PORT_UPGRADE_V1: int(1024,65535)
  MONGODB_PORT: int(1024,65535)
  RMI_PORT: int(1024,65535)
  TZ: str
  PUID: match(^[0-9]+$)
  PGID: match(^[0-9]+$)
  SHOW_SERVER_LOGS: list(true|false)
  SHOW_MONGODB_LOGS: list(true|false)
  SMALL_FILES: list(true|false)
